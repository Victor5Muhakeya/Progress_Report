<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#193b34">
    <meta name="description" content="Teacher workspace for Eagles Rising High School.">
    <title>Teacher workspace | Eagles Rising High School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/teacher-dashboard.css">
    <script src="js/teacher-dashboard.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Teacher workspace navigation">
            <a class="brand" href="teacher-dashboard.html" aria-label="Eagles Rising teacher workspace home">
                <img src="images.jpg" alt="" class="brand-logo">
                <span><strong>Eagles Rising</strong><small>Teacher workspace</small></span>
            </a>
            <div class="sidebar-label">Workspace</div>
            <nav class="navigation" id="navigation" aria-label="Teacher workspace">
                <button class="nav-link active" type="button" data-view="overview" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span>Overview</button>
                <button class="nav-link" type="button" data-view="profile"><span class="nav-icon" aria-hidden="true">♙</span>My Profile</button>
                <button class="nav-link" type="button" data-view="classes"><span class="nav-icon" aria-hidden="true">▤</span>My Classes</button>
                <button class="nav-link" type="button" data-view="subjects"><span class="nav-icon" aria-hidden="true">▧</span>My Subjects</button>
                <a class="nav-link" href="reports.html"><span class="nav-icon" aria-hidden="true">✎</span>Enter Results</a>
                <button class="nav-link" type="button" data-view="progress"><span class="nav-icon" aria-hidden="true">✓</span>Submission Progress</button>
                <button class="nav-link logout-link" type="button" data-view="logout"><span class="nav-icon" aria-hidden="true">↪</span>Logout</button>
            </nav>
            <div class="sidebar-bottom">
                <p>Teacher workspace · Demo data</p>
            </div>
        </aside>
        <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="Close navigation" hidden></button>

        <div class="main-shell">
            <header class="topbar">
                <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
                <div class="breadcrumb" aria-live="polite">
                    <span>Teacher workspace</span>
                    <strong id="viewCrumb">Overview</strong>
                </div>
                <div class="topbar-details" aria-label="Current reporting period">
                    <div class="period-item"><span>Academic year</span><strong id="academicYear"></strong></div>
                    <div class="period-item"><span>Current term</span><strong id="currentTerm"></strong></div>
                </div>
                <div class="teacher-identity">
                    <span class="avatar" id="teacherInitials" aria-hidden="true"></span>
                    <span class="teacher-identity-copy"><strong id="teacherName"></strong><small id="teacherStaffId"></small></span>
                </div>
            </header>
            <main class="content" id="content" tabindex="-1"></main>
            <footer class="page-footer">
                <span>Eagles Rising High School · Teacher workspace</span>
                <span>Sample data for demonstration — not connected to login or school records.</span>
            </footer>
        </div>
    </div>
    <p class="sr-only" id="viewAnnouncement" role="status" aria-live="polite"></p>
</body>
</html>
